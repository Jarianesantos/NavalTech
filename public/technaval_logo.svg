<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1584 396" width="100%" height="100%" text-rendering="geometricPrecision" shape-rendering="geometricPrecision">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070a14" />
      <stop offset="40%" stop-color="#0d1117" />
      <stop offset="100%" stop-color="#161b22" />
    </linearGradient>

    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#58a6ff" />
      <stop offset="100%" stop-color="#3fb950" />
    </linearGradient>

    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1f6feb" />
      <stop offset="100%" stop-color="#58a6ff" />
    </linearGradient>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <!-- CSS Animation for Caesar Cipher "GIF-like" shifting effect -->
    <style>
      @keyframes cipherPulse {
        0% { opacity: 0.3; transform: translateX(0); }
        50% { opacity: 0.9; transform: translateX(5px); }
        100% { opacity: 0.3; transform: translateX(0); }
      }
      @keyframes decryptEffect {
        0% { content: "Wkhfkqdydo"; }
        50% { content: "Te...al"; }
        100% { content: "TechNaval"; }
      }
      .cipher-anim {
        animation: cipherPulse 3s ease-in-out infinite;
      }
      .rotating-wheel {
        transform-origin: 150px 150px;
        animation: spinWheel 12s linear infinite;
      }
      @keyframes spinWheel {
        from { transform: rotate(0deg); }
        to { transform: rotate(360deg); }
      }
    </style>
  </defs>

  <!-- Background -->
  <rect width="1584" height="396" fill="url(#bgGrad)" />

  <!-- IDE / Blueprint Grid Pattern -->
  <g opacity="0.08" stroke="#58a6ff" stroke-width="1">
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" />
    </pattern>
    <rect width="1584" height="396" fill="url(#grid)" />
  </g>

  <!-- Terminal / Code & Caesar Cipher Watermarks in Background -->
  <g opacity="0.14" font-family="'Courier New', Courier, monospace" font-size="13" font-weight="bold" fill="#58a6ff">
    <text x="60" y="55">/* Caesar Cipher Encrypt / Decrypt Engine */</text>
    <text x="60" y="80">function caesarCipher(str, shift = 3) {</text>
    <text x="80" y="105">return str.replace(/[a-z]/gi, c => </text>
    <text x="105" y="130">String.fromCharCode(c.charCodeAt(0) + shift)</text>
    <text x="80" y="155">); // Output: Wkhfkqdydo ➔ TechNaval</text>
    <text x="60" y="180">}</text>
    
    <text x="1000" y="320" class="cipher-anim">ROT(3) CIPHER: Wkhfkqdydo [SHIFT] ➔ TechNaval.sys</text>
    <text x="1000" y="345">01001110 01000001 01010110 01000001 01001100</text>
  </g>

  <!-- DECORATIVE TECH CIRCUITS & WAVES -->
  <g opacity="0.3" stroke="#3fb950" stroke-width="1.5">
    <path d="M 0 320 Q 300 300 600 320 T 1200 320 T 1584 320" fill="none" stroke-dasharray="6,6" />
    <path d="M 0 340 Q 400 320 800 340 T 1584 340" fill="none" stroke="#58a6ff" />
  </g>

  <!-- MAIN BANNER CONTENT GROUP -->
  <g transform="translate(420, 75)">
    <!-- ICON SECTION (Left of group) -->
    <g transform="translate(0, 0)">
      <!-- Code Brackets { } -->
      <path d="M 35 30 C 20 30 20 45 20 55 L 20 58 C 20 68 10 73 0 76 C 10 79 20 84 20 94 L 20 97 C 20 107 20 122 35 122" fill="none" stroke="#58a6ff" stroke-width="3" stroke-linecap="round" opacity="0.9"/>
      <path d="M 205 30 C 220 30 220 45 220 55 L 220 58 C 220 68 230 73 240 76 C 230 79 220 84 220 94 L 220 97 C 220 107 220 122 205 122" fill="none" stroke="#58a6ff" stroke-width="3" stroke-linecap="round" opacity="0.9"/>

      <!-- Anchor + Tech Emblem -->
      <g filter="url(#glow)" transform="translate(40, -15)">
        <!-- Rotating Cipher Ring (Caesar Cipher Wheel Motif) -->
        <circle cx="80" cy="50" r="22" fill="none" stroke="#3fb950" stroke-width="1.5" stroke-dasharray="4,4" class="rotating-wheel" />
        <circle cx="80" cy="50" r="16" fill="none" stroke="#58a6ff" stroke-width="3.5" />
        <circle cx="80" cy="50" r="5" fill="#3fb950" />
        
        <!-- Circuit traces -->
        <path d="M 64 50 L 45 50 L 45 75" fill="none" stroke="#3fb950" stroke-width="2" />
        <circle cx="45" cy="75" r="2.5" fill="#3fb950" />
        <path d="M 96 50 L 115 50 L 115 75" fill="none" stroke="#3fb950" stroke-width="2" />
        <circle cx="115" cy="75" r="2.5" fill="#3fb950" />

        <!-- Anchor Shank -->
        <rect x="74" y="66" width="10" height="95" rx="3" fill="url(#blueGrad)" />
        
        <!-- Anchor Stock -->
        <rect x="44" y="86" width="72" height="7" rx="3.5" fill="url(#blueGrad)" />
        <circle cx="44" cy="89" r="3.5" fill="#58a6ff" />
        <circle cx="116" cy="89" r="3.5" fill="#58a6ff" />

        <!-- Flukes -->
        <path d="M 80 161 C 80 185 48 185 36 172 C 32 168 38 159 44 165 C 54 176 74 176 78 161 Z" fill="#1f6feb" />
        <path d="M 80 161 C 80 185 112 185 124 172 C 128 168 122 159 116 165 C 106 176 86 176 82 161 Z" fill="#1f6feb" />
        
        <polygon points="34,170 28,185 45,173" fill="#3fb950" />
        <polygon points="126,170 132,185 115,173" fill="#3fb950" />

        <!-- Digital Pulse -->
        <line x1="80" y1="72" x2="80" y2="155" stroke="#3fb950" stroke-width="2" stroke-dasharray="3,3" />
      </g>
    </g>

    <!-- TYPOGRAPHY SECTION (Right of icon) -->
    <g transform="translate(230, 15)">
      <!-- TechNaval(); -->
      <text x="0" y="80" font-family="'Times New Roman', Times, serif" font-weight="bold" font-size="82" fill="#f0f6fc" letter-spacing="1">
        Tech<tspan fill="#58a6ff">Naval</tspan><tspan font-family="'Courier New', monospace" font-weight="bold" fill="#3fb950" font-size="58">();</tspan>
      </text>

      <!-- Subtitle Tagline with Caesar Cipher hint -->
      <g transform="translate(4, 125)">
        <rect x="0" y="-8" width="60" height="3" fill="#3fb950" rx="1.5" />
        <text x="75" y="0" font-family="'Times New Roman', Times, serif" font-weight="normal" font-size="18" fill="#8b949e" letter-spacing="2">
          ADVANCED MARITIME SYSTEMS &amp; SOFTWARE ENGINEERING
        </text>
      </g>
    </g>
  </g>

  <!-- Status / Badge on top right with Caesar Cipher ROT indicator -->
  <g transform="translate(1300, 40)" opacity="0.9">
    <rect x="0" y="0" width="235" height="36" rx="18" fill="#161b22" stroke="#30363d" stroke-width="1.5" />
    <circle cx="20" cy="18" r="5" fill="#3fb950" />
    <text x="36" y="23" font-family="'Courier New', Courier, monospace" font-size="12" fill="#3fb950" font-weight="bold">ROT(3): Wkhfkqdydo</text>
  </g>
</svg>
